# Start:  docker compose up --build
# Tests:  see "Run the tests" in README.md. They run as their own project (-p crm-dam-test),
#         with their own database volume, so they never touch the dev stack.
name: crm-dam

x-app: &app
  build: { context: ., target: app }
  image: crm-dam-app:local

x-app-env: &app-env
  DATABASE_URL: postgres://crm_dam:crm_dam@db:5432/crm_dam
  TEST_DATABASE_URL: postgres://crm_dam:crm_dam@db:5432/crm_dam_test
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
  FILE_STORE_DIR: /var/lib/crm-dam/files
  AI_PROVIDER: ${AI_PROVIDER:-mock}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-claude-haiku-5-5}
  AI_EFFORT: ${AI_EFFORT:-medium}
  MOCK_DELAY_MS: ${MOCK_DELAY_MS:-1500}
  MOCK_FAIL: ${MOCK_FAIL:-false}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
  SEED_ON_START: ${SEED_ON_START:-true}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}

services:
  db:
    image: postgres:18.7
    environment:
      # Local-only credentials; the database port is not published to the host.
      POSTGRES_USER: crm_dam
      POSTGRES_PASSWORD: crm_dam
      POSTGRES_DB: crm_dam
    volumes:
      - db-data:/var/lib/postgresql
      - ./docker/db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      # Over TCP and on the test DB, so it only passes after the init script has run.
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U crm_dam -d crm_dam_test -c 'select 1' > /dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    <<: *app
    command: ["node", "src/db/migrate.ts"]
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    <<: *app
    environment: *app-env
    ports:
      - "3000:3000"
    volumes:
      - files:/var/lib/crm-dam/files
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck: &health
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40

  # ---- profile "test" (AD-7): `run unit` runs Vitest; `run e2e` resets the test DB,
  # starts app-test on it with an empty tmpfs file dir, and runs Playwright against it ----
  unit:
    <<: *app
    profiles: [test]
    command: ["node_modules/.bin/vitest", "run"]
    environment: &test-env
      <<: *app-env
      # Tests always use the mock, whatever a local .env says.
      AI_PROVIDER: mock
      ANTHROPIC_API_KEY: ""
      MOCK_DELAY_MS: "0"
    tmpfs:
      - /var/lib/crm-dam/files:uid=1000,gid=1000
    depends_on:
      db: { condition: service_healthy }

  test-reset:
    <<: *app
    profiles: [test]
    command: ["node", "src/db/reset-test.ts"]
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }

  app-test:
    <<: *app
    profiles: [test]
    environment:
      <<: *test-env
      DATABASE_URL: postgres://crm_dam:crm_dam@db:5432/crm_dam_test
      APP_ORIGIN: http://app-test:3000
    tmpfs:
      - /var/lib/crm-dam/files:uid=1000,gid=1000
    depends_on:
      test-reset: { condition: service_completed_successfully }
    healthcheck: *health

  e2e:
    build: { context: ., target: e2e }
    image: crm-dam-e2e:local
    profiles: [test]
    environment:
      APP_ORIGIN: http://app-test:3000
    depends_on:
      app-test: { condition: service_healthy }

volumes:
  db-data:
  files:
